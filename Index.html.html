<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Push-up Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0e0e;
      --panel: #171717;
      --panel-2: #202020;
      --text: #f4efe3;
      --muted: #8f8a7d;
      --gold: #e8d5a3;
      --gold-soft: rgba(232, 213, 163, 0.16);
      --green: #4caf7d;
      --green-soft: rgba(76, 175, 125, 0.16);
      --line: rgba(244, 239, 227, 0.10);
      --danger: #ef7d6b;
      --shadow: 0 18px 50px rgba(0,0,0,.35);
      --radius: 24px;
      --nav-h: 78px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(232, 213, 163, 0.10), transparent 34%),
        radial-gradient(circle at top right, rgba(76, 175, 125, 0.08), transparent 26%),
        var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      width: min(100%, 520px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 26px 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 22px;
    }

    .kicker {
      font-size: 11px;
      color: var(--gold);
      letter-spacing: .16em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    h1, h2, h3 {
      font-family: 'Syne', sans-serif;
      margin: 0;
      letter-spacing: -0.045em;
    }

    h1 { font-size: clamp(34px, 10vw, 50px); line-height: .9; }
    h2 { font-size: 28px; }
    h3 { font-size: 18px; }

    .date-card {
      text-align: right;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      padding-top: 4px;
      flex: 0 0 auto;
    }

    .screen { display: none; animation: rise .22s ease-out; }
    .screen.active { display: block; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero {
      background: linear-gradient(160deg, rgba(255,255,255,.055), rgba(255,255,255,.02));
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 8px);
      box-shadow: var(--shadow);
      padding: 26px 18px 22px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: -40% -20% auto auto;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(232,213,163,.16), transparent 68%);
      pointer-events: none;
    }

    .ring-wrap {
      display: grid;
      place-items: center;
      margin: 10px 0 24px;
      position: relative;
      z-index: 1;
    }

    .ring {
      width: 230px;
      height: 230px;
      transform: rotate(-90deg);
      overflow: visible;
    }

    .ring-bg, .ring-progress {
      fill: none;
      stroke-width: 15;
      stroke-linecap: round;
    }

    .ring-bg { stroke: rgba(244,239,227,.09); }
    .ring-progress {
      stroke: var(--gold);
      transition: stroke-dashoffset .35s ease, stroke .35s ease;
      filter: drop-shadow(0 0 9px rgba(232,213,163,.18));
    }

    .ring-center {
      position: absolute;
      text-align: center;
    }

    .count {
      font-family: 'Syne', sans-serif;
      font-size: 58px;
      line-height: .9;
      letter-spacing: -0.06em;
    }

    .goal {
      margin-top: 9px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .blocks {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 9px;
      margin-bottom: 16px;
    }

    .block {
      appearance: none;
      border: 1px solid var(--line);
      min-height: 74px;
      border-radius: 19px;
      background: var(--panel-2);
      color: var(--muted);
      font: 500 13px 'DM Mono', monospace;
      cursor: pointer;
      transition: transform .16s ease, background .16s ease, color .16s ease, border-color .16s ease;
    }

    .block:active { transform: scale(.96); }
    .block.done {
      background: linear-gradient(180deg, rgba(232,213,163,.24), rgba(232,213,163,.10));
      color: var(--text);
      border-color: rgba(232,213,163,.38);
    }

    .block.done.complete {
      background: linear-gradient(180deg, rgba(76,175,125,.32), rgba(76,175,125,.14));
      border-color: rgba(76,175,125,.42);
    }

    .primary-btn {
      width: 100%;
      border: 0;
      border-radius: 22px;
      min-height: 62px;
      background: var(--gold);
      color: #17130a;
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
      cursor: pointer;
      box-shadow: 0 12px 34px rgba(232,213,163,.14);
      transition: transform .16s ease, filter .16s ease, opacity .16s ease;
    }

    .primary-btn:active { transform: scale(.98); }
    .primary-btn:disabled { opacity: .45; filter: grayscale(.4); }

    .banner {
      display: none;
      margin-top: 16px;
      padding: 15px 16px;
      border-radius: 20px;
      background: var(--green-soft);
      border: 1px solid rgba(76,175,125,.34);
      color: #c9f7dc;
      line-height: 1.45;
    }

    .banner.show { display: block; }

    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 24px 2px 12px;
    }

    .hint { color: var(--muted); font-size: 11px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat {
      background: rgba(255,255,255,.045);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 17px 15px;
      min-height: 102px;
    }

    .stat.wide { grid-column: span 2; }
    .stat-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 10px;
    }

    .stat-value {
      font-family: 'Syne', sans-serif;
      font-size: 34px;
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .dots {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      background: rgba(255,255,255,.035);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 14px;
    }

    .dot-day {
      display: grid;
      place-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
    }

    .dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(244,239,227,.12);
      border: 1px solid rgba(244,239,227,.08);
    }

    .dot.partial { background: var(--gold-soft); border-color: rgba(232,213,163,.24); }
    .dot.complete { background: var(--green); border-color: var(--green); box-shadow: 0 0 14px rgba(76,175,125,.20); }

    .history {
      max-height: 380px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255,255,255,.035);
      scrollbar-width: thin;
    }

    .history-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 16px;
      border-bottom: 1px solid var(--line);
    }

    .history-row:last-child { border-bottom: 0; }
    .history-date { font-size: 12px; color: var(--text); }
    .history-day { color: var(--muted); font-size: 10px; margin-top: 4px; }
    .history-count { font-family: 'Syne', sans-serif; font-size: 23px; color: var(--gold); }
    .history-count.complete { color: var(--green); }

    nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 520px);
      height: calc(var(--nav-h) + env(safe-area-inset-bottom));
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: rgba(14,14,14,.84);
      backdrop-filter: blur(18px);
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      z-index: 10;
    }

    .nav-btn {
      border: 1px solid transparent;
      border-radius: 18px;
      background: transparent;
      color: var(--muted);
      font: 500 13px 'DM Mono', monospace;
      cursor: pointer;
    }

    .nav-btn.active {
      background: var(--gold-soft);
      border-color: rgba(232,213,163,.22);
      color: var(--gold);
    }

    .micro-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .ghost-btn {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.035);
      color: var(--muted);
      min-height: 44px;
      font: 500 12px 'DM Mono', monospace;
      cursor: pointer;
    }

    .ghost-btn:active { transform: scale(.98); }

    @media (max-width: 360px) {
      .ring { width: 205px; height: 205px; }
      .count { font-size: 50px; }
      .block { min-height: 64px; border-radius: 16px; }
      .stats-grid { gap: 10px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="todayScreen" class="screen active" aria-labelledby="todayTitle">
      <header>
        <div>
          <div class="kicker">Daily goal</div>
          <h1 id="todayTitle">Push-ups</h1>
        </div>
        <div class="date-card">
          <div id="dayName">Sunday</div>
          <div id="dateText">May 3, 2026</div>
        </div>
      </header>

      <div class="hero">
        <div class="ring-wrap" aria-live="polite">
          <svg class="ring" viewBox="0 0 240 240" role="img" aria-label="Daily push-up progress">
            <circle class="ring-bg" cx="120" cy="120" r="96"></circle>
            <circle id="ringProgress" class="ring-progress" cx="120" cy="120" r="96"></circle>
          </svg>
          <div class="ring-center">
            <div class="count"><span id="todayCount">0</span></div>
            <div class="goal">out of 100</div>
          </div>
        </div>

        <div id="blocks" class="blocks" aria-label="Push-up blocks"></div>
        <button id="addBtn" class="primary-btn" type="button">+20</button>
        <div id="completionBanner" class="banner">Goal complete. Strong body, stronger promise kept.</div>
        <div class="micro-actions">
          <button id="minusBtn" class="ghost-btn" type="button">-20</button>
          <button id="resetBtn" class="ghost-btn" type="button">Reset today</button>
        </div>
      </div>
    </section>

    <section id="statsScreen" class="screen" aria-labelledby="statsTitle">
      <header>
        <div>
          <div class="kicker">Momentum</div>
          <h1 id="statsTitle">Stats</h1>
        </div>
        <div class="date-card">
          <div>Goal</div>
          <div>100/day</div>
        </div>
      </header>

      <div class="stats-grid">
        <div class="stat">
          <div class="stat-label">7-day avg</div>
          <div id="avg7" class="stat-value">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">30-day avg</div>
          <div id="avg30" class="stat-value">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Current streak</div>
          <div id="streak" class="stat-value">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Best day</div>
          <div id="bestDay" class="stat-value">0</div>
        </div>
        <div class="stat wide">
          <div class="stat-label">All-time total</div>
          <div id="allTotal" class="stat-value">0</div>
        </div>
      </div>

      <div class="section-title">
        <h3>Last 7 days</h3>
        <div class="hint">green = 100+</div>
      </div>
      <div id="dotGrid" class="dots"></div>

      <div class="section-title">
        <h3>History</h3>
        <div class="hint">last 30 days</div>
      </div>
      <div id="history" class="history"></div>
    </section>
  </main>

  <nav aria-label="Main navigation">
    <button class="nav-btn active" data-tab="today" type="button">Today</button>
    <button class="nav-btn" data-tab="stats" type="button">Stats</button>
  </nav>

  <script>
    const GOAL = 100;
    const BLOCK = 20;
    const BLOCK_COUNT = 5;
    const STORAGE_PREFIX = 'pushups:';
    const circle = document.getElementById('ringProgress');
    const circumference = 2 * Math.PI * 96;

    circle.style.strokeDasharray = `${circumference}`;
    circle.style.strokeDashoffset = `${circumference}`;

    const el = {
      todayCount: document.getElementById('todayCount'),
      blocks: document.getElementById('blocks'),
      addBtn: document.getElementById('addBtn'),
      minusBtn: document.getElementById('minusBtn'),
      resetBtn: document.getElementById('resetBtn'),
      banner: document.getElementById('completionBanner'),
      dayName: document.getElementById('dayName'),
      dateText: document.getElementById('dateText'),
      avg7: document.getElementById('avg7'),
      avg30: document.getElementById('avg30'),
      streak: document.getElementById('streak'),
      bestDay: document.getElementById('bestDay'),
      allTotal: document.getElementById('allTotal'),
      dotGrid: document.getElementById('dotGrid'),
      history: document.getElementById('history'),
    };

    function dateKey(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function addDays(date, amount) {
      const copy = new Date(date);
      copy.setDate(copy.getDate() + amount);
      return copy;
    }

    function formatDate(date, options) {
      return new Intl.DateTimeFormat('en', options).format(date);
    }

    function getReps(key = dateKey()) {
      return Number(localStorage.getItem(STORAGE_PREFIX + key) || 0);
    }

    function setReps(value, key = dateKey()) {
      const normalized = Math.max(0, Math.min(GOAL, Number(value) || 0));
      if (normalized === 0) localStorage.removeItem(STORAGE_PREFIX + key);
      else localStorage.setItem(STORAGE_PREFIX + key, String(normalized));
      render();
    }

    function getAllEntries() {
      return Object.keys(localStorage)
        .filter(k => k.startsWith(STORAGE_PREFIX))
        .map(k => ({ key: k.replace(STORAGE_PREFIX, ''), reps: Number(localStorage.getItem(k) || 0) }))
        .filter(item => /^\d{4}-\d{2}-\d{2}$/.test(item.key))
        .sort((a, b) => b.key.localeCompare(a.key));
    }

    function lastNDays(n) {
      const today = new Date();
      return Array.from({ length: n }, (_, i) => {
        const date = addDays(today, -(n - 1 - i));
        const key = dateKey(date);
        return { date, key, reps: getReps(key) };
      });
    }

    function average(days) {
      if (!days.length) return 0;
      return Math.round(days.reduce((sum, day) => sum + day.reps, 0) / days.length);
    }

    function currentStreak() {
      let streak = 0;
      let cursor = new Date();
      while (getReps(dateKey(cursor)) >= GOAL) {
        streak += 1;
        cursor = addDays(cursor, -1);
      }
      return streak;
    }

    function bestDayValue() {
      const entries = getAllEntries();
      return entries.length ? Math.max(...entries.map(e => e.reps)) : 0;
    }

    function allTimeTotal() {
      return getAllEntries().reduce((sum, item) => sum + item.reps, 0);
    }

    function renderToday() {
      const today = new Date();
      const reps = getReps();
      const blocksDone = reps / BLOCK;
      const complete = reps >= GOAL;
      const progress = Math.min(reps / GOAL, 1);

      el.dayName.textContent = formatDate(today, { weekday: 'long' });
      el.dateText.textContent = formatDate(today, { month: 'long', day: 'numeric', year: 'numeric' });
      el.todayCount.textContent = reps;
      circle.style.strokeDashoffset = `${circumference * (1 - progress)}`;
      circle.style.stroke = complete ? 'var(--green)' : 'var(--gold)';
      el.addBtn.disabled = complete;
      el.banner.classList.toggle('show', complete);

      el.blocks.innerHTML = '';
      for (let i = 1; i <= BLOCK_COUNT; i++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'block';
        btn.textContent = `${i * BLOCK}`;
        btn.setAttribute('aria-label', `Toggle ${i * BLOCK} push-ups`);
        if (blocksDone >= i) btn.classList.add('done');
        if (complete && blocksDone >= i) btn.classList.add('complete');
        btn.addEventListener('click', () => {
          const next = blocksDone >= i ? (i - 1) * BLOCK : i * BLOCK;
          setReps(next);
        });
        el.blocks.appendChild(btn);
      }
    }

    function renderStats() {
      const days7 = lastNDays(7);
      const days30 = lastNDays(30);
      el.avg7.textContent = average(days7);
      el.avg30.textContent = average(days30);
      el.streak.textContent = currentStreak();
      el.bestDay.textContent = bestDayValue();
      el.allTotal.textContent = allTimeTotal();

      el.dotGrid.innerHTML = '';
      days7.forEach(day => {
        const wrap = document.createElement('div');
        wrap.className = 'dot-day';
        const dot = document.createElement('div');
        dot.className = 'dot';
        if (day.reps > 0 && day.reps < GOAL) dot.classList.add('partial');
        if (day.reps >= GOAL) dot.classList.add('complete');
        const label = document.createElement('div');
        label.textContent = formatDate(day.date, { weekday: 'short' }).slice(0, 2);
        wrap.title = `${day.key}: ${day.reps} reps`;
        wrap.append(dot, label);
        el.dotGrid.appendChild(wrap);
      });

      el.history.innerHTML = '';
      days30.slice().reverse().forEach(day => {
        const row = document.createElement('div');
        row.className = 'history-row';
        const left = document.createElement('div');
        const date = document.createElement('div');
        date.className = 'history-date';
        date.textContent = formatDate(day.date, { month: 'short', day: 'numeric', year: 'numeric' });
        const weekday = document.createElement('div');
        weekday.className = 'history-day';
        weekday.textContent = formatDate(day.date, { weekday: 'long' });
        left.append(date, weekday);
        const count = document.createElement('div');
        count.className = `history-count${day.reps >= GOAL ? ' complete' : ''}`;
        count.textContent = day.reps;
        row.append(left, count);
        el.history.appendChild(row);
      });
    }

    function render() {
      renderToday();
      renderStats();
    }

    el.addBtn.addEventListener('click', () => {
      const current = getReps();
      setReps(current + BLOCK);
    });

    el.minusBtn.addEventListener('click', () => {
      const current = getReps();
      setReps(current - BLOCK);
    });

    el.resetBtn.addEventListener('click', () => setReps(0));

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b === btn));
        document.getElementById('todayScreen').classList.toggle('active', tab === 'today');
        document.getElementById('statsScreen').classList.toggle('active', tab === 'stats');
        render();
      });
    });

    render();
  </script>
</body>
</html>
